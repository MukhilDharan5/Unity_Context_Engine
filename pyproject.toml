[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unity-context"
version = "0.1.0"
description = "A small, read-only Linux device context TUI"
requires-python = ">=3.11"
dependencies = ["dbus-next>=0.2.3,<0.3"]

[project.scripts]
unity-context = "unity_context.app:main"

[tool.setuptools.packages.find]
include = ["unity_context*"]
