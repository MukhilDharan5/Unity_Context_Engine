[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "Unity_Context_Engine"
version = "0.1.0"
description = "Context Engine, a read-only Libadwaita desktop workload observer"
requires-python = ">=3.11"
dependencies = ["dbus-next>=0.2.3,<0.3"]

[project.scripts]
unity-context = "unity_context.app:main"

[tool.setuptools.packages.find]
include = ["unity_context*"]

[tool.setuptools.package-data]
unity_context = ["icons/hicolor/*/apps/*.svg"]
